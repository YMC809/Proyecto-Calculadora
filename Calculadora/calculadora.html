<!DOCTYPE html>
<html lang="gl">

<head>
    <meta charset="UTF-8">
    <title>Calculadora v3</title>
    <link rel="stylesheet" href="estilos.css" type="text/css">
</head>

<body>
    <div id="carcasa">
        <div id="pantalla">0</div>
        <div id="botoeira">
            <div class="tecla" id="teclaCE">CE</div>
            <div class="tecla" id="teclaC">C</div>
            <div class="tecla" id="tecla7">7</div>
            <div class="tecla" id="tecla8">8</div>
            <div class="tecla" id="tecla9">9</div>
            <div class="tecla" id="teclamas">+</div>

            <div class="tecla" id="tecla5">5</div>
            <div class="tecla" id="tecla6">6</div>
            <div class="tecla" id="teclaresta">-</div>
            <div class="tecla" id="tecla1">1</div>
            <div class="tecla" id="tecla2">2</div>
            <div class="tecla" id="tecla3">3</div>
            <div class="tecla" id="teclaproduto">*</div>
            <div class="tecla" id="teclacoma">,</div>
            <div class="tecla" id="tecla0">0</div>
            <div class="tecla" id="teclaigual">=</div>
            <div class="tecla" id="tecladivision">/</div>
        </div>
    </div>
    <script src="calculadora.js"></script>
